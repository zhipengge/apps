<?xml version="1.0" encoding="UTF-8"?>
<!--
  自律勇者 SelfQuest — App 图标
  盾牌（自律） + 番茄钟圆环（专注） + 金色对勾（完成） + 小星星（奖励）
  纯矢量，无外部资源，无文字，无渐变，无阴影。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 深蓝圆角方形底 -->
  <rect width="512" height="512" rx="114" ry="114" fill="#1B2A4A"/>

  <!-- 盾牌：上宽下尖，用两段圆弧收拢到底点 -->
  <path d="M256 78
           C 306 78 344 92 372 106
           L 372 250
           C 372 336 320 396 256 428
           C 192 396 140 336 140 250
           L 140 106
           C 168 92 206 78 256 78 Z"
        fill="#F6F1E7"/>

  <!-- 盾牌内圈：再收一层，做出厚度感而不靠阴影 -->
  <path d="M256 106
           C 296 106 328 116 348 127
           L 348 250
           C 348 322 306 372 256 400
           C 206 372 164 322 164 250
           L 164 127
           C 184 116 216 106 256 106 Z"
        fill="#1B2A4A"/>

  <!-- 番茄钟圆环（未完成的部分，番茄红） -->
  <circle cx="256" cy="238" r="74"
          fill="none" stroke="#E4574C" stroke-width="15"
          stroke-linecap="round"
          stroke-dasharray="349 116"
          transform="rotate(-90 256 238)"/>

  <!-- 番茄钟顶部的小柄 -->
  <rect x="245" y="146" width="22" height="20" rx="7" fill="#E4574C"/>

  <!-- 金色对勾：落在圆环内的偏左，重心稳 -->
  <path d="M222 240 L246 266 L294 212"
        fill="none" stroke="#F5C451" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右上角小星星：四角星，比五角星更几何、更像「奖励」 -->
  <path d="M392 128
           C 394 146 400 152 418 154
           C 400 156 394 162 392 180
           C 390 162 384 156 366 154
           C 384 152 390 146 392 128 Z"
        fill="#F5C451"/>
</svg>
